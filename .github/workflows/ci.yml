name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins stable + rustfmt + clippy; rustup honours it.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # No `cargo fmt --check` gate: this repo uses a hand-tuned style with no
      # rustfmt.toml, so default rustfmt disagrees with nearly every existing
      # file. Add a rustfmt.toml capturing the intended style before gating fmt.
      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --workspace
